name: Refresh GitHub stats

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "package.json", "package-lock.json"]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build stats card from the GitHub GraphQL API
        run: npm run build:stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
      - name: Commit only when the data changed
        run: |
          if git diff --quiet -- data/stats.json assets/stats.png assets/stats-mobile.png; then
            echo "Stats unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets/stats.png assets/stats-mobile.png
          git commit -m "chore(stats): refresh GitHub stats"
          git push
